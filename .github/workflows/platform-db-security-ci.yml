name: Platform DB Security (Step 08)

# Isolated PostgreSQL concurrency / atomicity gate for Release 47 Step 08.
# Does not deploy and does not use production databases.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/src/modules/auth/**'
      - 'apps/api/prisma/**'
      - 'apps/api/scripts/*platform-db*'
      - 'apps/api/scripts/migrate-platform-db-security.mjs'
      - 'apps/api/scripts/run-platform-db-security.mjs'
      - 'docker-compose.test.yml'
      - '.github/workflows/platform-db-security-ci.yml'

jobs:
  platform-db-security:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking_test
          POSTGRES_DB: booking_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: apps/api

    env:
      NODE_ENV: test
      RUN_PLATFORM_DB_SECURITY: 'true'
      ALLOW_TEST_DATABASE_RESET: 'true'
      INTEGRATION_DATABASE_URL: postgresql://booking:booking_test@localhost:5433/booking_test?schema=public
      DATABASE_URL: postgresql://booking:booking_test@localhost:5433/booking_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate test database
        run: npm run db:test:migrate
      - name: Upgrade migration validation (duplicate pending invitations)
        run: npm run db:test:upgrade-validate
      - name: Run platform DB security suites
        run: npm run test:platform-db-security
      - name: Super Admin regression (typecheck/build smoke via tests)
        working-directory: .
        run: npm run test --workspace=@booking/super-admin
    timeout-minutes: 45
