# Manual / on-demand: build Nest clinic-test API image and push to Azure Container Registry.
# Free-trial Azure often blocks `az acr build` (ACR Tasks). GitHub-hosted Docker build bypasses that.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ACR_LOGIN_SERVER  e.g. acrclinictest.azurecr.io
#   ACR_USERNAME      ACR admin username (Access keys)
#   ACR_PASSWORD      ACR admin password (Access keys)
#
# Do not put Neon/JWT secrets here — only registry push credentials.

name: Clinic-test API → ACR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to push
        required: true
        default: d1

permissions:
  contents: read

concurrency:
  group: clinic-test-acr-push
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push clinic-test-api
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Use API dockerignore at repo root context
        run: cp apps/api/.dockerignore .dockerignore

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/clinic-test-api:${{ inputs.image_tag }}
          provenance: false
          sbom: false
